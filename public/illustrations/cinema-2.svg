<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 400 300" fill="none">
<defs>

            <filter id="brush-stroke" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
                <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="3" seed="14" result="noise" ></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="displaced" ></feDisplacementMap>
                <feComponentTransfer in="displaced">
                    <feFuncA type="linear" slope="1.05" intercept="-0.02" ></feFuncA>
                </feComponentTransfer>
            </filter>


            <filter id="ink-edge" x="-5%" y="-5%" width="110%" height="110%">
                <feTurbulence type="turbulence" baseFrequency="0.03 0.08" numOctaves="4" seed="7" result="rough" ></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="rough" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="inked" ></feDisplacementMap>
                <feComponentTransfer in="inked">
                    <feFuncA type="discrete" tableValues="0 0.2 0.85 1" ></feFuncA>
                </feComponentTransfer>
            </filter>


            <filter id="watercolor-wash" x="-15%" y="-15%" width="130%" height="130%">
                <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="21" result="washNoise" ></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="washNoise" scale="9" xChannelSelector="R" yChannelSelector="B" result="washed" ></feDisplacementMap>
                <feGaussianBlur in="washed" stdDeviation="0.6" ></feGaussianBlur>
            </filter>


            <pattern id="ink-hatch" width="8" height="8" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#141413" stroke-width="0.9" stroke-opacity="0.22" ></line>
            </pattern>
            <pattern id="red-hatch" width="6" height="6" patternTransform="rotate(-40 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#C8372D" stroke-width="0.8" stroke-opacity="0.28" ></line>
            </pattern>
        </defs><style>.brush-stroke{filter:url(#brush-stroke)}.ink-edge{filter:url(#ink-edge)}.watercolor-wash{filter:url(#watercolor-wash)}.hero-rain-line{stroke-dasharray:12 8}</style>
                        <rect width="400" height="300" fill="#FBF9F5"></rect>

                        <rect width="400" height="190" fill="url(#ink-hatch)"></rect>

                        <g class="svg-transition svg-anim-beam">
                            <polygon points="155,78 0,25 0,130" fill="#D49B35" fill-opacity="0.38" class="watercolor-wash"></polygon>
                            <polygon points="155,78 400,20 400,135" fill="#C8372D" fill-opacity="0.28" class="watercolor-wash"></polygon>
                        </g>

                        <g class="brush-stroke">
                            <path d="M132 225 L142 88 L168 88 L178 225 Z" fill="#FBF9F5" stroke="#141413" stroke-width="3"></path>

                            <polygon points="139,120 171,120 173,148 137,148" fill="#C8372D"></polygon>
                            <polygon points="135,175 175,175 177,202 133,202" fill="#C8372D"></polygon>

                            <rect x="144" y="66" width="22" height="22" fill="#D49B35" stroke="#141413" stroke-width="2.5"></rect>
                            <polygon points="138,66 155,48 172,66" fill="#141413"></polygon>

                            <path d="M65 265 C95 215, 130 210, 155 212 C185 215, 220 225, 245 265 Z" fill="#141413"></path>
                        </g>

                        <g class="brush-stroke svg-transition svg-anim-float">
                            <path d="M10 250 Q55 225 100 250 T190 250 T280 250 T390 250" stroke="#141413" stroke-width="3" fill="none"></path>
                            <path d="M0 270 Q50 245 105 270 T210 270 T315 270 T400 270" stroke="#141413" stroke-width="2.2" fill="none"></path>
                            <path d="M25 286 Q85 268 145 286 T265 286 T385 286" stroke="#C8372D" stroke-width="1.8" fill="none"></path>
                        </g>
                    </svg>
